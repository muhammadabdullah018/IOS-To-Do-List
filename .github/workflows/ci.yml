name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS build and tests (macOS, Xcode)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: SkydayKit unit tests (swift test)
        working-directory: Packages/SkydayKit
        run: swift test 2>&1 | tee ../../kit-tests.log
      - name: List project
        run: xcodebuild -list -project Skyday.xcodeproj
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in sorted(d.items()) if "iOS" in k for x in v if x["name"].startswith("iPhone")]; p=[x for x in c if x["name"]=="iPhone 16"]; print((p or c)[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build app for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project Skyday.xcodeproj -scheme Skyday \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO | tee build.log | tail -40
      - name: Unit and UI tests on simulator
        run: |
          set -o pipefail
          xcodebuild test -project Skyday.xcodeproj -scheme Skyday \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DD -resultBundlePath build/Skyday.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)" | tail -200
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d build/Skyday.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Skyday.xcresult --output-path screenshots || true
          fi
          ls -la screenshots
      - name: Package simulator app
        if: always()
        run: |
          APP=$(find build/DD/Build/Products -name "Skyday.app" -path "*iphonesimulator*" | head -1)
          if [ -n "$APP" ]; then ditto -c -k --keepParent "$APP" Skyday-simulator.app.zip; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            kit-tests.log
            build.log
            test.log
            screenshots
            Skyday-simulator.app.zip
          if-no-files-found: warn

  web:
    name: Web demo (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
